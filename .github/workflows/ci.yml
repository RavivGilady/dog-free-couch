name: CI

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            server/requirements.txt
      - name: Install dependencies
        run: |
          pip install -r requirements.txt -r server/requirements.txt pytest pytest-playwright
          # The runner has no libGL; swap in the headless OpenCV build.
          pip uninstall -y opencv-python
          # Same <5 cap as requirements.txt: OpenCV 5 dropped the Caffe loader
          # the detector needs.
          pip install "opencv-python-headless>=4.8,<5"
      - name: Cache detector model
        id: model
        uses: actions/cache@v4
        with:
          path: models/MobileNetSSD_deploy.caffemodel
          key: mobilenet-ssd-caffemodel-v1
      - name: Download detector model
        if: steps.model.outputs.cache-hit != 'true'
        run: python download_model.py
      - name: Install browser for dashboard tests
        run: playwright install --with-deps chromium
      - name: Run tests
        run: python -m pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build server image
        run: docker build -t dog-free-couch-server .
