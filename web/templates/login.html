<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign in - Dog Couch Monitor</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}"
    />
  </head>
  <body class="login-page">
    <main class="login-card">
      <div class="login-mark">DOG FREE COUCH</div>

      {% if first_run %}
      <h1>Set a password</h1>
      <p class="muted">
        First run. Pick a password to protect the dashboard &mdash; it is
        hashed, never stored in plain text.
      </p>
      {% else %}
      <h1>Sign in</h1>
      <p class="muted">Enter your dashboard password.</p>
      {% endif %} {% if error %}
      <div class="alert-error">{{ error }}</div>
      {% endif %}

      <form method="post" autocomplete="off">
        <label for="password"
          >{{ "New password" if first_run else "Password" }}</label
        >
        <input
          type="password"
          id="password"
          name="password"
          required
          autofocus
          minlength="{{ 8 if first_run else 1 }}"
          placeholder="{{ 'At least 8 characters' if first_run else '' }}"
        />
        <button type="submit">
          {{ "Set password" if first_run else "Sign in" }}
        </button>
      </form>
    </main>
  </body>
</html>
